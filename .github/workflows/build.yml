name: Build

on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
    Build:
      needs: []
      runs-on: ${{ matrix.os }}
      strategy:
        fail-fast: false
        matrix:
          os: [windows-2022, windows-2025, windows-2025-vs2026]
          configuration: [Debug, Release]
          platform: [x86, x64, ARM64]
      steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
        with:
          msbuild-architecture: x64
      - name: Nuget Restore
        run: nuget.exe restore templates/templates.sln
      # Only Windows Server 2022 ships the WDK Visual Studio integration, so it is the only image that can build the driver projects.
      - name: Build
        if: matrix.os == 'windows-2022'
        run: msbuild templates/templates.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}
      # VS 2026 images have no WDK MSBuild integration yet, so build only the user-mode projects (exercises the v145 toolset).
      - name: Build user-mode projects
        if: matrix.os != 'windows-2022'
        run: msbuild templates/templates.sln /t:"dll;lib" /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}
    Complete:
      name: Complete
      if: always()
      needs: Build
      runs-on: ubuntu-latest
      permissions: {}
      steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe
        with:
          jobs: ${{ toJSON(needs) }}
